<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owner Dashboard</title>
<style>
:root{--bg:#FDF9F5;--card:#fff;--blue:#7A5A46;--blue-dark:#4A3428;--blue-soft:#F7F3EE;--text:#4A3428;--muted:#806f65;--danger:#c62828;--success:#1b7f3a;--border:#D8CCC1;--shadow:0 16px 42px rgba(74,52,40,.08)}
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 5% 15%,rgba(216,204,193,.26),transparent 24%),var(--bg);color:var(--text);min-height:100vh}
body::after{content:"✿";position:fixed;left:3vw;bottom:2vh;z-index:0;color:rgba(122,90,70,.08);font-size:120px;pointer-events:none}
header{background:rgba(255,255,255,.94);padding:20px 30px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);box-shadow:0 5px 18px rgba(74,52,40,.08)}
header h1{margin:0;color:var(--blue-dark)}
.container{padding:28px;max-width:1200px;margin:auto}
section{background:var(--card);padding:24px;margin-bottom:24px;border-radius:18px;border:1px solid var(--border);box-shadow:var(--shadow)}
h2{margin-top:0;color:var(--blue-dark)}
input,select,textarea{padding:11px;margin:5px;border-radius:9px;border:1px solid #D9C1AF;background:#fff;color:var(--text);min-width:150px;outline:none;transition:.2s ease}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(122,90,70,.11)}
button{padding:10px 15px;margin:5px;border:0;border-radius:9px;background:linear-gradient(135deg,var(--blue),var(--blue-dark));color:#fff;font-weight:700;cursor:pointer;box-shadow:0 8px 18px rgba(74,52,40,.15);transition:.2s ease}
button:hover{transform:translateY(-1px);box-shadow:0 11px 22px rgba(74,52,40,.26)}
.logout{background:#fff;color:var(--blue);border:1px solid var(--blue);box-shadow:none}
.delete-btn{background:#fff0f0;color:var(--danger);border:1px solid #e6a7a7;box-shadow:none}
.approve-btn{background:#effbf2;color:#1b7f3a;border:1px solid #9ed3aa;box-shadow:none}
.reject-btn{background:#fff0f0;color:var(--danger);border:1px solid #e6a7a7;box-shadow:none}
.secondary-btn{background:#fff3f8;color:var(--text);border:1px solid #D9C1AF;box-shadow:none}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;align-items:end}
.form-field{display:flex;flex-direction:column}.form-field label{color:#4f6f89;font-size:13px;margin:0 6px 3px}.form-field input,.form-field select,.form-field textarea{width:100%;margin:0}
.contact-note{color:var(--muted);font-size:13px;margin:8px 5px}
.message{display:none;margin-top:12px;padding:10px;border-radius:8px}.message.success{display:block;background:#effbf2;color:var(--success);border:1px solid #b9e1c2}.message.error{display:block;background:#fff0f0;color:var(--danger);border:1px solid #f5c6c6}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px;background:#fff}th,td{padding:11px;text-align:center;border-bottom:1px solid #f5dce7}th{background:var(--blue-soft);color:var(--blue-dark);font-weight:600}tr:hover{background:#f9f5f1}
.appointment-filter{display:flex;flex-wrap:wrap;align-items:end;gap:10px;margin-bottom:16px;padding:14px;border:1px solid var(--border);border-radius:12px;background:#F7F3EE}
.appointment-filter .form-field{min-width:210px}.appointment-filter button{margin:0}.appointment-count{margin-inline-start:auto;color:var(--blue-dark);font-weight:700;background:#fff;padding:10px 14px;border-radius:8px;border:1px solid var(--border)}
.empty-row td{padding:26px;color:var(--muted);font-weight:600}
.gallery-upload{margin-bottom:20px}
.gallery-upload input[type="file"]{display:inline-block;width:auto;min-width:auto}
#galleryContainer{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px}
#galleryContainer .gallery-item-admin{background:#F7F3EE;padding:12px;border-radius:10px;text-align:center;border:1px solid var(--border);position:relative}
#galleryContainer .gallery-item-admin img{max-width:120px;max-height:120px;border-radius:8px}
#galleryContainer .gallery-item-admin button{width:100%;margin-top:8px;padding:6px;font-size:12px}
.modal{display:none;position:fixed;inset:0;background:rgba(67,39,55,.58);z-index:1000;padding:20px;overflow:auto}.modal.open{display:flex;align-items:center;justify-content:center}.modal-card{width:90%;max-width:500px;background:#fff;padding:24px;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-card h2{margin-top:0}
@media(max-width:700px){body::after{font-size:72px}header{padding:15px}.container{padding:14px}section{padding:16px;border-radius:14px}input,select,textarea{min-width:0}.appointment-filter{align-items:stretch}.form-field{min-width:0}}
</style>
</head>
<body>
<header><h1>✿ Beauty Dashboard</h1><button class="logout" onclick="logout()">Logout</button></header>
<div class="container">
<section><h2>שעות פעילות</h2><div id="workingHoursContainer"></div><button onclick="saveWorkingHours()">שמור שינויים</button></section>
<section><h2>שירותים</h2><div class="form-grid"><div class="form-field"><label>שם שירות</label><input id="serviceNameInput"></div><div class="form-field"><label>מחיר</label><input id="servicePriceInput" type="number"></div><div class="form-field"><label>ערבון</label><input id="serviceDepositInput" type="number"></div><div class="form-field"><label>משך (דקות)</label><input id="serviceDurationInput" type="number"></div><button onclick="addService()">הוסף שירות</button></div><div class="table-wrap"><table id="servicesTable"><thead><tr><th>שם</th><th>מחיר</th><th>ערבון</th><th>משך</th><th>פעולות</th></tr></thead><tbody></tbody></table></div></section>
<section><h2>➕ קביעת תור ידנית</h2><div class="form-grid"><div class="form-field"><label>שם לקוח</label><input id="manualName" placeholder="שם מלא"></div><div class="form-field"><label>טלפון</label><input id="manualPhone" placeholder="05xxxxxxxx"></div><div class="form-field"><label>שירות</label><select id="manualService"></select></div><div class="form-field"><label>תאריך</label><input id="manualDate" type="date"></div><div class="form-field"><label>שעה</label><input id="manualTime" type="time"></div><button onclick="pickContact()">בחר מ-Contacts</button><button onclick="createManualAppointment()">צור תור</button></div><div id="manualMessage" class="message"></div></section>
<section>
<h2>תורים</h2>
<div class="appointment-filter">
<div class="form-field"><label for="appointmentDateFilter">📅 הצג תורים בתאריך</label><input id="appointmentDateFilter" type="date"></div>
<button onclick="filterAppointmentsByDate()">הצג תורים</button>
<button class="secondary-btn" onclick="clearAppointmentDateFilter()">הצג הכל</button>
<div id="appointmentCount" class="appointment-count">0 תורים</div>
</div>
<div class="table-wrap"><table id="appointmentsTable"><thead><tr><th>שם</th><th>טלפון</th><th>שירות</th><th>משך</th><th>תאריך</th><th>שעת הגעה</th><th>שעת סיום</th><th>סטטוס</th><th>פעולות</th></tr></thead><tbody></tbody></table></div>
</section>
<section class="gallery-upload">
<h2>גלריה</h2>
<div class="form-grid">
<div class="form-field"><label>בחר תמונה</label><input type="file" id="imageInput" accept="image/*"></div>
<button onclick="uploadImage()">העלה תמונה</button>
</div>
<div id="galleryMessage" class="message"></div>
<div id="galleryContainer"></div>
</section>
</div>
<div id="editModal" class="modal"><div class="modal-card"><h2>✏️ עריכת תור</h2><input type="hidden" id="editId"><div class="form-grid"><div class="form-field"><label>שם לקוח</label><input id="editName"></div><div class="form-field"><label>טלפון</label><input id="editPhone"></div><div class="form-field"><label>שירות</label><select id="editService"></select></div><div class="form-field"><label>תאריך</label><input id="editDate" type="date"></div><div class="form-field"><label>שעה</label><input id="editTime" type="time"></div></div><div style="text-align:center"><button onclick="saveAppointmentEdit()">שמור</button><button class="secondary-btn" onclick="closeEditModal()">ביטול</button></div></div></div>
<script>
const API_URL=['localhost','127.0.0.1'].includes(window.location.hostname)?'http://localhost:5001/api':'/api';
const token=localStorage.getItem('token');if(!token)location.href='admin.html';
let servicesCache=[];let appointmentsCache=[];
document.addEventListener('DOMContentLoaded',()=>{loadServices();loadAppointments();loadGallery();loadWorkingHours();manualDate.min=new Date().toISOString().split('T')[0];appointmentDateFilter.addEventListener('change',filterAppointmentsByDate)});
async function loadWorkingHours(){const r=await fetch(`${API_URL}/settings`),d=await r.json(),c=workingHoursContainer;c.innerHTML='';const n={sunday:'ראשון',monday:'שני',tuesday:'שלישי',wednesday:'רביעי',thursday:'חמישי',friday:'שישי',saturday:'שבת'};Object.keys(n).forEach(day=>{const s=d.workingHours?.[day]||{};c.innerHTML+=`<div style="margin-bottom:12px;padding:12px;background:#f9f5f1;border-radius:8px"><label style="font-weight:600">${n[day]}</label><div style="margin-top:8px"><input type="time" id="${day}_start" value="${s.start||'09:00'}" style="width:100px"> עד <input type="time" id="${day}_end" value="${s.end||'18:00'}" style="width:100px"><label style="margin-inline-start:10px"><input type="checkbox" id="${day}_enabled" ${s.enabled!==false?'checked':''}> פעיל</label><button class="secondary-btn" style="font-size:12px;padding:6px" onclick="addBreak('${day}')">+ הפסקה</button></div><div id="${day}_breaks" style="margin-top:8px"></div>${s.breaks?.map((b,i)=>`<div><input type="time" value="${b.start}" id="${day}_breakStart_${i}"> - <input type="time" value="${b.end}" id="${day}_breakEnd_${i}"></div>`).join('')}</div>`})};
async function saveWorkingHours(){const out={};for(const day of ['sunday','monday','tuesday','wednesday','thursday','friday','saturday']){const breaks=[];document.querySelectorAll(`[id^="${day}_breakStart"]`).forEach((el,i)=>{const s=el.value,e=document.getElementById(`${day}_breakEnd_${i}`).value;if(s&&e)breaks.push({start:s,end:e})});out[day]={start:document.getElementById(`${day}_start`).value,end:document.getElementById(`${day}_end`).value,breaks,enabled:document.getElementById(`${day}_enabled`).checked}}try{const r=await fetch(`${API_URL}/settings`,{method:'PUT',headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},body:JSON.stringify({workingHours:out})});if(r.ok)alert('שעות עודכנו בהצלחה!')}catch(e){console.error(e)}};
function addBreak(day){const c=document.getElementById(`${day}_breaks`),i=Date.now();c.insertAdjacentHTML('beforeend',`<div><input type="time" id="${day}_breakStart_${i}"> - <input type="time" id="${day}_breakEnd_${i}"></div>`)};
async function loadServices(){const r=await fetch(`${API_URL}/services`);servicesCache=await r.json();const t=document.querySelector('#servicesTable tbody');t.innerHTML='';manualService.innerHTML='<option value="">בחר שירות</option>';servicesCache.forEach(s=>{t.innerHTML+=`<tr><td>${s.name}</td><td>${s.price}</td><td>${s.depositAmount}</td><td>${s.duration}</td><td><button class="delete-btn" onclick="deleteService('${s._id}')">מחק</button></td></tr>`;const opt=document.createElement('option');opt.value=s.name;opt.textContent=s.name;manualService.appendChild(opt);const opt2=document.createElement('option');opt2.value=s.name;opt2.textContent=s.name;editService.appendChild(opt2)})};
async function addService(){const p={name:serviceNameInput.value.trim(),price:Number(servicePriceInput.value),depositAmount:Number(serviceDepositInput.value),duration:Number(serviceDurationInput.value)};if(!p.name)return alert('שם שירות חובה');const r=await fetch(`${API_URL}/services`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},body:JSON.stringify(p)});if(r.ok){serviceNameInput.value='';servicePriceInput.value='';serviceDepositInput.value='';serviceDurationInput.value='';loadServices()}else alert('שגיאה בהוספת שירות')};
async function deleteService(id){if(!confirm('למחוק שירות?'))return;await fetch(`${API_URL}/services/${id}`,{method:'DELETE',headers:{'Authorization':`Bearer ${token}`}});loadServices()};
async function updateService(id){const p={price:Number(document.getElementById(`price_${id}`).value),depositAmount:Number(document.getElementById(`deposit_${id}`).value),duration:Number(document.getElementById(`duration_${id}`).value)};const r=await fetch(`${API_URL}/services/${id}`,{method:'PUT',headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},body:JSON.stringify(p)});if(r.ok)loadServices();else alert('שגיאה בעדכון')};
async function pickContact(){try{const l=await navigator.contacts.select(['name','tel'],{multiple:false});if(!l.length)return;manualName.value=(l[0].name&&l[0].name[0])||'';manualPhone.value=normalizeIsraeliPhone(l[0].tel?.[0]?.number||'')}catch(e){console.log('Contacts API not available')}};
function normalizeIsraeliPhone(v){let p=String(v).replace(/\D/g,'');if(p.startsWith('972'))p='0'+p.slice(3);return p};
function addMinutesToTime(time,minutesToAdd){const [h,m]=String(time).split(':').map(Number),total=h*60+m+Number(minutesToAdd||0);return `${String(Math.floor(total/60)%24).padStart(2,'0')}:${String(total%60).padStart(2,'0')}`};
async function createManualAppointment(){const p={customerName:manualName.value.trim(),customerPhone:normalizeIsraeliPhone(manualPhone.value),service:manualService.value,date:manualDate.value,time:manualTime.value,endTime:addMinutesToTime(manualTime.value,30)};if(!p.customerName||!p.customerPhone||!p.service||!p.date||!p.time)return showManual('כל השדות חובה','error');const r=await fetch(`${API_URL}/appointments`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},body:JSON.stringify(p)});if(r.ok){showManual('תור נוצר בהצלחה!','success');manualName.value='';manualPhone.value='';manualService.value='';manualDate.value='';manualTime.value='';loadAppointments()}else showManual('שגיאה ביצירת התור','error')};
function showManual(text,type){manualMessage.textContent=text;manualMessage.className=`message ${type}`};
function getAppointmentDateKey(appointment){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jerusalem',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(appointment.date))};
function appointmentStatusLabel(status){return({pending:'ממתין לאישור','awaiting-deposit':'ממתין לערבון',confirmed:'מאושר סופית',cancelled:'בוטל',completed:'הושלם'}[status]||status)};
function renderAppointments(list){const t=document.querySelector('#appointmentsTable tbody');t.innerHTML='';appointmentCount.textContent=`${list.length} תורים`;if(list.length===0){t.innerHTML='<tr class="empty-row"><td colspan="9">אין תורים</td></tr>';return}list.forEach(a=>{const endTime=addMinutesToTime(a.time,a.serviceDuration||30);t.innerHTML+=`<tr><td>${a.customerName}</td><td>${a.customerPhone}</td><td>${a.service}</td><td>${a.serviceDuration}</td><td>${a.date}</td><td>${a.time}</td><td>${endTime}</td><td>${appointmentStatusLabel(a.status)}</td><td><button class="secondary-btn" onclick="openEditModal('${a._id}')">ערוך</button>${a.status==='pending'?`<button class="approve-btn" onclick="approveAppointment('${a._id}')">אשר</button><button class="reject-btn" onclick="rejectAppointment('${a._id}')">דחה</button>`:''}${a.status!=='completed'?`<button class="delete-btn" onclick="deleteAppointment('${a._id}')">מחק</button>`:''}</td></tr>`)})};
async function loadAppointments(){const r=await fetch(`${API_URL}/appointments`,{headers:{Authorization:`Bearer ${token}`}}),d=await r.json();appointmentsCache=d.data||[];filterAppointmentsByDate()};
function filterAppointmentsByDate(){const selectedDate=appointmentDateFilter.value;const filtered=selectedDate?appointmentsCache.filter(a=>getAppointmentDateKey(a)===selectedDate):appointmentsCache;renderAppointments(filtered)};
function clearAppointmentDateFilter(){appointmentDateFilter.value='';renderAppointments(appointmentsCache)};
async function updatePendingAppointment(id,status,reason=''){const a=appointmentsCache.find(x=>x._id===id);if(!a)return;const p={customerName:a.customerName,customerPhone:a.customerPhone,service:a.service,date:a.date,time:a.time,endTime:addMinutesToTime(a.time,a.serviceDuration||30),status,cancellationReason:reason};const r=await fetch(`${API_URL}/appointments/${id}`,{method:'PUT',headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},body:JSON.stringify(p)});if(r.ok)loadAppointments();else alert('שגיאה בעדכון')};
function approveAppointment(id){if(confirm('לאשר את התור?'))updatePendingAppointment(id,'confirmed')};
function rejectAppointment(id){const reason=prompt('סיבת הדחייה (אופציונלי):');if(reason===null)return;updatePendingAppointment(id,'cancelled',reason.trim())};
function openEditModal(id){const a=appointmentsCache.find(x=>x._id===id);if(!a)return;editId.value=a._id;editName.value=a.customerName;editPhone.value=a.customerPhone;editService.value=a.service;editDate.value=a.date;editTime.value=a.time;editModal.classList.add('open')};
function closeEditModal(){editModal.classList.remove('open')};
async function saveAppointmentEdit(){const p={customerName:editName.value.trim(),customerPhone:normalizeIsraeliPhone(editPhone.value),service:editService.value,date:editDate.value,time:editTime.value,endTime:addMinutesToTime(editTime.value,30)};const r=await fetch(`${API_URL}/appointments/${editId.value}`,{method:'PUT',headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},body:JSON.stringify(p)});if(r.ok){closeEditModal();loadAppointments()}else alert('שגיאה בעדכון')};
async function deleteAppointment(id){if(!confirm('למחוק תור?'))return;await fetch(`${API_URL}/appointments/${id}`,{method:'DELETE',headers:{Authorization:`Bearer ${token}`}});loadAppointments()};
async function loadGallery(){try{const r=await fetch(`${API_URL}/gallery`),imgs=await r.json();galleryContainer.innerHTML='';imgs.forEach(i=>galleryContainer.innerHTML+=`<div class="gallery-item-admin"><img src="${i.image}" alt="Gallery"><button class="delete-btn" onclick="deleteGalleryImage('${i._id}')">מחק</button></div>`)}catch(e){console.error('Error loading gallery:',e)}};
async function uploadImage(){const file=imageInput.files[0];if(!file)return alert('בחר תמונה');const formData=new FormData();formData.append('image',file);try{const r=await fetch(`${API_URL}/gallery`,{method:'POST',headers:{Authorization:`Bearer ${token}`},body:formData});if(r.ok){imageInput.value='';galleryMessage.textContent='תמונה הועלתה בהצלחה!';galleryMessage.className='message success';loadGallery();setTimeout(()=>galleryMessage.textContent='',3000)}else galleryMessage.textContent='שגיאה בהעלאה';galleryMessage.className='message error'}catch(e){console.error('Upload error:',e);galleryMessage.textContent='שגיאה בחיבור';galleryMessage.className='message error'}};
async function deleteGalleryImage(id){if(!confirm('למחוק תמונה?'))return;try{const r=await fetch(`${API_URL}/gallery/${id}`,{method:'DELETE',headers:{Authorization:`Bearer ${token}`}});if(r.ok){loadGallery();galleryMessage.textContent='תמונה נמחקה בהצלחה!';galleryMessage.className='message success';setTimeout(()=>galleryMessage.textContent='',3000)}else galleryMessage.textContent='שגיאה במחיקה';galleryMessage.className='message error'}catch(e){console.error('Delete error:',e);galleryMessage.textContent='שגיאה בחיבור';galleryMessage.className='message error'}};
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))};
function logout(){localStorage.removeItem('token');location.href='admin.html'}
</script>
</body>
</html>
