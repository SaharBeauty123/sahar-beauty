<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sahar Beauty - תשלום ערבון לתור">
  <title>Sahar Beauty - תשלום ערבון</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .deposit-page { padding-top: 120px; background: var(--ivory); }
    .deposit-page .container { padding-top: 55px; }
    .deposit-card { text-align: center; }
    .deposit-card h1 { margin-bottom: 8px; color: var(--blue-dark); font-size: 28px; }
    .deposit-intro { margin-bottom: 22px; color: var(--muted); }
    .deposit-summary { margin-bottom: 24px; padding: 18px; border: 1px solid var(--border); border-radius: 16px; background: var(--blue-light); }
    .deposit-amount { color: var(--blue-dark); font-size: 32px; font-weight: 800; }
    .payment-options { display: grid; gap: 14px; }
    .payment-option { padding: 18px; border: 1px solid var(--border); border-radius: 16px; background: #fff; text-align: start; }
    .payment-option h2 { margin-bottom: 5px; color: var(--blue-dark); font-size: 19px; }
    .payment-option p { margin-bottom: 13px; color: var(--muted); font-size: 14px; }
    .cash-button { background: linear-gradient(135deg, #7d5267, #ad748f); }
    .demo-note { margin-top: 18px; color: #9a6b7f; font-size: 12px; }
    #paymentMessage { display: none; margin-top: 18px; padding: 14px; border-radius: 12px; }
    #paymentMessage.success { display: block; border: 1px solid #8dc89d; background: #effbf2; color: #217a38; }
    #paymentMessage.error { display: block; border: 1px solid #ecaaaa; background: #fff1f1; color: #a52a2a; }
    @media (max-width: 680px) { .deposit-page { padding-top: 135px; } .deposit-page .container { padding-top: 35px; } }
  </style>
</head>
<body class="deposit-page">
  <header class="site-header">
    <a href="index.html#home" class="wordmark" aria-label="Sahar Beauty home">Sahar Beauty</a>
    <button class="menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false">☰</button>
    <nav class="main-nav" aria-label="Primary navigation">
      <a href="index.html#about" data-deposit-i18n="navAbout">אודות</a>
      <a href="index.html#services" data-deposit-i18n="navServices">שירותים</a>
      <a href="gallery.html" data-deposit-i18n="navPortfolio">גלריה</a>
      <a href="index.html#testimonials" data-deposit-i18n="navReviews">המלצות</a>
      <a href="index.html#contact" data-deposit-i18n="navContact">יצירת קשר</a>
    </nav>
    <div class="header-actions">
      <div class="language-switcher" aria-label="Language selector">
        <button type="button" data-lang="ar">AR</button>
        <button type="button" data-lang="he" class="active">HE</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <a href="index.html#booking" class="header-book" data-deposit-i18n="bookNow">קבעי תור</a>
    </div>
  </header>

  <div class="container">
    <main class="deposit-card">
      <h1 data-deposit-i18n="depositTitle">נשאר רק לשלם ערבון 🌸</h1>
      <p class="deposit-intro" data-deposit-i18n="depositIntro">לשמירת התור יש לבחור אמצעי תשלום.</p>

      <section class="deposit-summary">
        <div id="appointmentSummary">טוען את פרטי התור...</div>
        <div class="deposit-amount">₪<span id="depositAmount">0</span></div>
        <small data-deposit-i18n="depositAmount">סכום הערבון</small>
      </section>

      <div class="payment-options">
        <section class="payment-option">
          <h2 data-deposit-i18n="bitTitle">🟢 תשלום באמצעות Bit</h2>
          <p data-deposit-i18n="bitText">פתחי את Bit, השלימי את התשלום ואז חזרי לעמוד לאישור.</p>
          <button type="button" class="payment-action" id="openBitButton" onclick="openBitPayment()" data-deposit-i18n="bitButton">פתיחת תשלום ב-Bit</button>
          <button type="button" class="payment-action" id="confirmBitButton" onclick="confirmBitPayment()" data-deposit-i18n="confirmBitButton" hidden>שילמתי — אישור סופי</button>
        </section>
      </div>

      <div id="paymentMessage"></div>
      <p class="demo-note" data-deposit-i18n="demoNote">קישורי התשלום בעמוד זה הם זמניים לצורך הדגמה.</p>
    </main>
  </div>

  <script>
    const API_URL = 'http://localhost:5001/api';
    const OWNER_WHATSAPP = '972503172506';
    const DEMO_PAYMENT_LINK = 'https://example.com/bit-payment-demo';
    const depositTranslations = {
      he: {navAbout:'אודות',navServices:'שירותים',navPortfolio:'גלריה',navReviews:'המלצות',navContact:'יצירת קשר',bookNow:'קבעי תור',depositTitle:'נשאר רק לשלם ערבון 🌸',depositIntro:'השלימי תשלום ב-Bit כדי לאשר את התור סופית.',depositAmount:'סכום הערבון',bitTitle:'🟢 תשלום באמצעות Bit',bitText:'פתחי את Bit, השלימי את התשלום ואז חזרי לעמוד לאישור.',bitButton:'פתיחת תשלום ב-Bit',confirmBitButton:'שילמתי — אישור סופי',demoNote:'קישור התשלום זמני לצורך הדגמה.'},
      ar: {navAbout:'من أنا',navServices:'الخدمات',navPortfolio:'الأعمال',navReviews:'آراء العميلات',navContact:'تواصل',bookNow:'احجزي الآن',depositTitle:'بقي دفع العربون فقط 🌸',depositIntro:'أكملي الدفع عبر Bit لتأكيد الموعد نهائياً.',depositAmount:'قيمة العربون',bitTitle:'🟢 الدفع بواسطة Bit',bitText:'افتحي Bit وأكملي الدفع ثم عودي إلى الصفحة للتأكيد.',bitButton:'فتح الدفع عبر Bit',confirmBitButton:'دفعت — تأكيد نهائي',demoNote:'رابط الدفع مؤقت لأغراض العرض.'},
      en: {navAbout:'About',navServices:'Services',navPortfolio:'Portfolio',navReviews:'Reviews',navContact:'Contact',bookNow:'Book Now',depositTitle:'Just one step left: the deposit 🌸',depositIntro:'Complete the Bit deposit to finalize your appointment.',depositAmount:'Deposit amount',bitTitle:'🟢 Pay with Bit',bitText:'Open Bit, complete payment, then return here to confirm.',bitButton:'Open Bit Payment',confirmBitButton:'I Paid — Finalize',demoNote:'The payment link is temporary for demonstration purposes.'}
    };

    function applyDepositLanguage(lang) {
      const selected = depositTranslations[lang] ? lang : 'he';
      document.documentElement.lang = selected;
      document.documentElement.dir = selected === 'en' ? 'ltr' : 'rtl';
      document.querySelectorAll('[data-deposit-i18n]').forEach((element) => {
        element.textContent = depositTranslations[selected][element.dataset.depositI18n];
      });
      document.querySelectorAll('[data-lang]').forEach((button) => button.classList.toggle('active', button.dataset.lang === selected));
      localStorage.setItem('saharLanguage', selected);
    }

    document.querySelectorAll('[data-lang]').forEach((button) => button.addEventListener('click', () => applyDepositLanguage(button.dataset.lang)));
    const menuToggle = document.querySelector('.menu-toggle');
    const mainNav = document.querySelector('.main-nav');
    menuToggle.addEventListener('click', () => {
      const open = mainNav.classList.toggle('open');
      menuToggle.setAttribute('aria-expanded', String(open));
    });
    applyDepositLanguage(localStorage.getItem('saharLanguage') || 'he');

    const params = new URLSearchParams(window.location.search);
    const appointmentId = params.get('id');
    const paymentToken = params.get('token');

    if (!appointmentId || !paymentToken) {
      showPaymentMessage('לא נמצאו פרטי התור. יש לחזור ולקבוע תור מחדש.', 'error');
    } else {
      loadPaymentDetails();
    }

    async function loadPaymentDetails() {
      try {
        const response = await fetch(`${API_URL}/appointments/payment/${appointmentId}?token=${encodeURIComponent(paymentToken)}`);
        const result = await response.json();
        if (!response.ok) throw new Error(result.error);
        const appointment = result.data;
        document.getElementById('appointmentSummary').textContent = `${appointment.customerName} • ${appointment.service} • ${new Date(appointment.date).toLocaleDateString()} • ${appointment.time}–${appointment.endTime}`;
        document.getElementById('depositAmount').textContent = appointment.amount ?? 0;
      } catch (error) {
        showPaymentMessage(error.message || 'שגיאה בטעינת פרטי התשלום', 'error');
        document.querySelectorAll('.payment-action').forEach((button) => { button.disabled = true; });
      }
    }

    function openBitPayment() {
      window.open(DEMO_PAYMENT_LINK, '_blank', 'noopener');
      document.getElementById('confirmBitButton').hidden = false;
    }

    async function confirmBitPayment() {
      if (!appointmentId) return;
      const buttons = document.querySelectorAll('.payment-action');
      buttons.forEach((button) => { button.disabled = true; });

      try {
        const response = await fetch(`${API_URL}/appointments/${appointmentId}/deposit/confirm`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ method: 'bit', token: paymentToken })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'התשלום לא אושר');

        showPaymentMessage('✅ הערבון נקלט והתור שלך אושר בהצלחה!', 'success');
        setTimeout(() => { window.location.href = './gallery.html'; }, 1800);
      } catch (error) {
        buttons.forEach((button) => { button.disabled = false; });
        showPaymentMessage(error.message || 'שגיאה באישור התשלום', 'error');
      }
    }

    function showPaymentMessage(text, type) {
      const box = document.getElementById('paymentMessage');
      box.textContent = text;
      box.className = type;
    }
  </script>
</body>
</html>
