<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sahar Beauty Portfolio — a collection of timeless beauty and unforgettable bridal moments">
  <title>Portfolio — Sahar Beauty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="arabic-fonts.css">
  <style>
    .gallery-page{background:var(--ivory)}
    .gallery-hero{padding:clamp(160px,18vw,230px) clamp(22px,8vw,130px) clamp(70px,9vw,125px);text-align:center;background:linear-gradient(145deg,var(--ivory),var(--ivory-alt))}
    .gallery-hero .eyebrow{margin-bottom:22px}
    .gallery-hero h1{font:500 clamp(72px,12vw,170px)/.75 var(--serif);letter-spacing:-.055em;text-transform:lowercase}
    .gallery-hero p:last-child{max-width:720px;margin:42px auto 0;color:var(--muted);font:400 clamp(20px,2.5vw,32px)/1.35 var(--serif)}
    .gallery-shell{padding:clamp(65px,9vw,125px) clamp(18px,7vw,110px)}
    .gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:clamp(12px,1.7vw,22px)}
    .gallery-item{position:relative;overflow:hidden;height:280px;background:var(--sand);cursor:zoom-in}
    .gallery-item img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.78);transition:transform .7s cubic-bezier(.2,.75,.25,1),filter .4s ease}
    .gallery-item:hover img{transform:scale(1.035);filter:saturate(.9)}
    .gallery-item:after{content:'View';position:absolute;inset:auto 18px 16px auto;padding:7px 12px;background:rgba(253,249,245,.88);color:var(--espresso);font-size:9px;letter-spacing:.14em;text-transform:uppercase;opacity:0;transform:translateY(6px);transition:all .3s ease}
    .gallery-item:hover:after{opacity:1;transform:none}
    .gallery-empty{grid-column:1/-1;padding:90px 20px;text-align:center;color:var(--muted);font:400 28px var(--serif)}
    .success-banner{max-width:700px;margin:0 auto 30px;padding:14px;background:#eef5ec;color:#315c34;border:1px solid #c9dec6;text-align:center}
    .gallery-modal{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:30px;background:rgba(32,23,18,.93);cursor:zoom-out}
    .gallery-modal.active{display:flex}
    .gallery-modal img{max-width:min(1100px,94vw);max-height:90vh;object-fit:contain}
    .modal-close{position:absolute;top:22px;right:25px;border:0;background:transparent;color:#fff;font:300 35px var(--serif);cursor:pointer}
    @media(max-width:900px){.gallery-grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}.gallery-item{height:250px}}
    @media(max-width:600px){.gallery-hero{padding-top:180px}.gallery-hero h1{font-size:78px}.gallery-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.gallery-item{height:210px}.modal-close{font-size:28px}}
  </style>
</head>
<body class="gallery-page">
  <header class="site-header">
    <a href="index.html#home" class="wordmark" aria-label="Sahar Beauty home">Sahar Beauty</a>
    <button class="menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false">☰</button>
    <nav class="main-nav" aria-label="Primary navigation">
      <a href="index.html#about" data-gallery-i18n="navAbout">אודות</a>
      <a href="#portfolio" data-gallery-i18n="navPortfolio">גלריה</a>
      <a href="index.html#testimonials" data-gallery-i18n="navReviews">המלצות</a>
      <a href="index.html#contact" data-gallery-i18n="navContact">יצירת קשר</a>
    </nav>
    <div class="header-actions">
      <div class="language-switcher" aria-label="Language selector">
        <button type="button" data-lang="ar">AR</button>
        <button type="button" data-lang="he" class="active">HE</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <a href="index.html#booking" class="header-book" data-gallery-i18n="bookNow">קבעי תור</a>
    </div>
  </header>

  <main id="portfolio">
    <section class="gallery-hero">
      <p class="eyebrow">Sahar Beauty</p>
      <h1>Portfolio</h1>
      <p data-gallery-i18n="portfolioIntro">A collection of timeless beauty and unforgettable bridal moments.</p>
    </section>

    <section class="gallery-shell">
      <div id="successMessage" class="success-banner" hidden></div>
      <div class="gallery-grid" id="galleryGrid" aria-live="polite"></div>
    </section>
  </main>

  <footer class="site-footer">
    <a href="index.html" class="wordmark">Sahar Beauty</a>
    <p>Bridal &amp; Event Makeup Artist</p>
    <div><a href="index.html#booking" data-gallery-i18n="bookNow">קבעי תור</a><span>© 2026 Sahar Beauty</span></div>
  </footer>

  <div class="gallery-modal" id="imageModal" onclick="closeModal()" role="dialog" aria-modal="true" aria-label="Portfolio image">
    <button class="modal-close" type="button" aria-label="Close">×</button>
    <img id="modalImage" alt="Sahar Beauty portfolio">
  </div>
  <a class="whatsapp-float" href="https://wa.me/972538800769" target="_blank" rel="noopener" aria-label="Chat on WhatsApp"><svg viewBox="0 0 32 32" width="27" height="27" aria-hidden="true" focusable="false"><path fill="currentColor" d="M16 0C7.16 0 0 7.16 0 16c0 2.73.71 5.32 1.95 7.57L0 32l8.64-1.89C10.95 31.18 13.41 32 16 32c8.84 0 16-7.16 16-16S24.84 0 16 0zm0 30c-2.2 0-4.36-.5-6.3-1.46l-.45-.25-4.7 1.03 1.05-4.56-.27-.44C2.3 20.63 1.99 18.37 1.99 16c0-7.73 6.29-14 14.01-14 7.71 0 14 6.27 14 14s-6.29 14-14 14zm7.58-8.9c-.42-.21-2.48-1.22-2.87-1.36-.39-.14-.67-.21-.95.21-.28.42-1.09 1.36-1.34 1.64-.25.28-.49.31-.91.1-.42-.21-1.77-.65-3.37-2.08-1.25-1.11-2.09-2.48-2.34-2.9-.25-.42-.03-.64.19-.85.19-.18.42-.47.63-.71.21-.24.28-.41.42-.68.14-.28.07-.52-.04-.73-.11-.21-.95-2.28-1.3-3.12-.34-.83-.69-.71-.95-.72h-.81c-.28 0-.73.1-.11.73-.42.75-.73 1.63-.73 2.52 0 .88.24 1.75.73 2.51l3.37 5.36c3.2 4.93 7.98 6.87 12.45 5.68.42-.11.81-.42 1.02-.83.21-.41.41-.96.55-1.51.14-.55.28-.93.28-1.22 0-.29-.07-.47-.49-.68z"/></svg></a>

  <script>
    const API_URL = ['localhost', '127.0.0.1'].includes(window.location.hostname)
      ? 'http://localhost:5001/api'
      : '/api';

    const grid = document.getElementById('galleryGrid');
    const modal = document.getElementById('imageModal');
    const modalImage = document.getElementById('modalImage');
    const galleryTranslations = {
      he: {
        navAbout: 'אודות',
        navServices: 'שירותים',
        navPortfolio: 'גלריה',
        navReviews: 'המלצות',
        navContact: 'יצירת קשר',
        bookNow: 'קבעי תור',
        portfolioIntro: 'אוסף של רגעים זמורים ולא שכיחים של כלות'
      },
      ar: {
        navAbout: 'من أنا',
        navServices: 'الخدمات',
        navPortfolio: 'الأعمال',
        navReviews: 'آراء العميلات',
        navContact: 'تواصل',
        bookNow: 'احجزي الآن',
        portfolioIntro: 'مجموعة من لحظات العروس التي لا تُنسى'
      },
      en: {
        navAbout: 'About',
        navServices: 'Services',
        navPortfolio: 'Portfolio',
        navReviews: 'Reviews',
        navContact: 'Contact',
        bookNow: 'Book Now',
        portfolioIntro: 'A collection of timeless beauty and unforgettable bridal moments'
      }
    };

    function setGalleryLanguage(language) {
      const lang = galleryTranslations[language] ? language : 'he';
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'en' ? 'ltr' : 'rtl';
      localStorage.setItem('saharLanguage', lang);
      document.querySelectorAll('[data-gallery-i18n]').forEach(el => {
        const value = galleryTranslations[lang][el.dataset.galleryI18n];
        if (value) el.textContent = value;
      });
      document.querySelectorAll('[data-lang]').forEach(button => button.classList.toggle('active', button.dataset.lang === lang));
    }

    async function loadGallery() {
      grid.innerHTML = '';
      try {
        const res = await fetch(`${API_URL}/gallery`);
        if (!res.ok) throw new Error('Failed to load gallery');
        const images = await res.json();

        if (!images.length) {
          grid.innerHTML = '<p class="gallery-empty">Portfolio coming soon.</p>';
          return;
        }

        images.forEach((imgData, index) => {
          const card = document.createElement('article');
          card.className = 'gallery-item';
          const img = document.createElement('img');
          img.src = imgData.image;
          img.alt = `Sahar Beauty portfolio ${index + 1}`;
          img.loading = 'lazy';
          card.appendChild(img);
          card.addEventListener('click', () => {
            modalImage.src = imgData.image;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
          });
          grid.appendChild(card);
        });
      } catch (error) {
        console.error('Error loading gallery:', error);
        grid.innerHTML = '<p class="gallery-empty">Error loading portfolio.</p>';
      }
    }

    function closeModal() {
      modal.classList.remove('active');
      document.body.style.overflow = '';
    }

    document.addEventListener('DOMContentLoaded', () => {
      setGalleryLanguage(localStorage.getItem('saharLanguage') || 'he');
      document.querySelectorAll('[data-lang]').forEach(button => button.addEventListener('click', () => setGalleryLanguage(button.dataset.lang)));

      const menuButton = document.querySelector('.menu-toggle');
      const navigation = document.querySelector('.main-nav');
      if (menuButton && navigation) {
        menuButton.addEventListener('click', () => {
          const isOpen = navigation.classList.toggle('open');
          menuButton.setAttribute('aria-expanded', String(isOpen));
        });
        navigation.querySelectorAll('a').forEach((link) => link.addEventListener('click', () => navigation.classList.remove('open')));
      }

      document.addEventListener('keydown', event => {
        if (event.key === 'Escape') closeModal();
      });

      const message = localStorage.getItem('bookingSuccess');
      if (message) {
        const banner = document.getElementById('successMessage');
        banner.textContent = message;
        banner.hidden = false;
        localStorage.removeItem('bookingSuccess');
        setTimeout(() => banner.hidden = true, 5000);
      }

      loadGallery();
    });
  </script>
</body>
</html>
